<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; }
  body { width: 3000px; height: 1000px; overflow: hidden;
         background: #fffdf7; color: #17150f;
         font-family: Georgia, "Times New Roman", serif;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .wrap { display: flex; align-items: center; height: 1000px;
          padding: 0 150px; box-sizing: border-box; gap: 90px; }
  .left { flex: 1; padding-bottom: 150px; }
  .brand { font-size: 40px; letter-spacing: 20px; color: #8a6d1a;
           text-transform: uppercase; margin-bottom: 34px; }
  .line { font-size: 84px; line-height: 1.22; font-variant: small-caps;
          letter-spacing: 1px; }
  .sub { font-size: 42px; font-style: italic; color: #555; margin-top: 30px; }
  table.grid { border-collapse: separate; border-spacing: 0; }
  table.grid td { width: 104px; height: 104px;
                  box-shadow: inset 0 0 0 5px #17150f;
                  position: relative; text-align: center; vertical-align: middle;
                  font-family: Helvetica, Arial, sans-serif; font-size: 54px;
                  background: #fff; }
  table.grid td.blk { box-shadow: none; background: transparent; }
  table.grid td .num { position: absolute; top: 5px; left: 9px;
                       font-size: 24px; color: #666; }
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="brand">The Glass Company</div>
    <div class="line">Every answer comes<br>from one person's life.</div>
    <div class="sub">Built to order by an AI. $15.</div>
  </div>
  <table class="grid">
    <tr>
      <td><span class="num">1</span>C</td><td>R</td><td>O</td><td>S</td><td>S</td>
      <td>W</td><td>O</td><td>R</td><td><span class="num">2</span>D</td>
      <td class="blk"></td><td class="blk"></td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td>O</td><td class="blk"></td><td class="blk"></td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td>S</td><td class="blk"></td><td class="blk"></td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td>S</td><td class="blk"></td><td class="blk"></td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td><span class="num">3</span>B</td><td>R</td><td>I</td><td>E</td><td>F</td>
      <td>I</td><td>N</td><td>G</td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td>E</td><td class="blk"></td><td class="blk"></td>
    </tr>
    <tr>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td class="blk"></td><td class="blk"></td><td class="blk"></td><td class="blk"></td>
      <td>R</td><td class="blk"></td><td class="blk"></td>
    </tr>
  </table>
</div>
</body></html>
